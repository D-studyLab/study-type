<style>
/* ============================================================
   見た目の方針（2026-08-09 作り直し）
     ・明るく、中高生に馴染むトーン。夜空／星／紺金はやめた
     ・主色はティール（緑青）＋差し色コーラル。紫は使わない
     ・8タイプそれぞれに固有色。結果ページは「自分の色」になる
   設問は 2026-08-09 に4択へ作り直した（下の QUESTIONS のコメント参照）
   ============================================================ */
:root{
  --bg:#fbfaf6;          /* ごく淡いクリーム */
  --bg2:#f2f1ea;
  --surface:#ffffff;
  --line:#e7e3d8;
  --line2:#d8d3c5;
  --ink:#1d2430;         /* 本文 */
  --dim:#6d6a63;         /* 補助 */
  --brand:#0e9b93;       /* 主色：ティール */
  --brand-d:#0a726c;
  --brand-s:#e6f4f2;
  --accent:#f2603f;      /* 差し色：コーラル */
  --accent-d:#c3411f;
  --accent-s:#fdeee9;
  --warn:#b8791a;
  --warn-s:#fdf4e3;
  --warn-l:#efdcb4;
  --r:20px;
  --shadow:0 2px 0 rgba(29,36,48,.04), 0 10px 24px rgba(29,36,48,.06);
  --shadow-l:0 4px 0 rgba(29,36,48,.05), 0 18px 38px rgba(29,36,48,.09);
  /* 結果ページで上書きされるタイプ色 */
  --t:#0e9b93; --ts:#e6f4f2; --td:#0a726c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%}
body{
  background:
    radial-gradient(720px 380px at 8% -6%, #e9f6f4 0%, rgba(233,246,244,0) 62%),
    radial-gradient(640px 340px at 100% 2%, #fdece7 0%, rgba(253,236,231,0) 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);font-size:16px;line-height:1.8;min-height:100vh;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  font-feature-settings:"palt" 1;
  -webkit-font-smoothing:antialiased;
  overflow-wrap:anywhere;
}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 80px;position:relative}

h1{font-size:29px;line-height:1.38;margin:10px 0 12px;font-weight:900;letter-spacing:-.01em}
.kick{display:inline-block;background:var(--brand-s);color:var(--brand-d);
  font-size:11.5px;letter-spacing:.16em;font-weight:900;
  padding:6px 13px;border-radius:99px}
.lead{color:var(--dim);font-size:15px;margin:0 0 22px;line-height:1.85}
.lead b{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 20px;box-shadow:var(--shadow)}

.btn{display:block;width:100%;border:0;border-radius:16px;padding:18px 18px;
  font-size:17px;font-weight:900;cursor:pointer;font-family:inherit;letter-spacing:.02em;
  background:linear-gradient(180deg,#12b0a7,var(--brand));color:#fff;margin-top:16px;
  box-shadow:0 4px 0 #086f69, 0 10px 20px rgba(14,155,147,.28);transition:.12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #086f69, 0 4px 10px rgba(14,155,147,.22)}
.btn.accent{background:linear-gradient(180deg,#f7745a,var(--accent));
  box-shadow:0 4px 0 #bd3d1c, 0 10px 20px rgba(242,96,63,.26)}
.btn.accent:active{box-shadow:0 1px 0 #bd3d1c, 0 4px 10px rgba(242,96,63,.2)}
.btn.sub{background:var(--surface);color:var(--ink);border:2px solid var(--line2);
  box-shadow:0 3px 0 var(--line2);font-weight:800}
.btn.sub:active{box-shadow:0 1px 0 var(--line2)}

.hint{display:flex;gap:10px;align-items:flex-start;background:var(--accent-s);
  border-radius:14px;padding:13px 15px;margin:0 0 4px}
.hint .dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;
  background:var(--accent);margin-top:9px}
.hint p{margin:0;font-size:14.5px;line-height:1.8}

/* 設問 */
.pwrap{margin-bottom:22px}
.pbar{height:11px;background:#eae7dd;border-radius:99px;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(29,36,48,.07)}
.pbar>i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--brand),#3fc0a2 55%,var(--accent));
  width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}
.pnum{font-size:12.5px;color:var(--dim);font-weight:800;margin-top:8px;
  display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.pnum .now{color:var(--brand-d)}
/* 場面の見出し。「いつ・どこの話か」を先に出すと答えやすい（本人指示 2026-08-09） */
.scene{display:inline-block;background:var(--accent-s);color:var(--accent-d);
  font-size:12.5px;font-weight:900;letter-spacing:.06em;padding:5px 12px;border-radius:999px;
  margin:6px 0 10px}
.q{font-size:21px;font-weight:900;line-height:1.6;margin:0 0 20px;letter-spacing:-.005em}
.opt{position:relative;display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--surface);color:var(--ink);
  border:2px solid var(--line);border-radius:18px;padding:17px 16px;margin-bottom:13px;
  font-size:16px;font-weight:700;line-height:1.7;cursor:pointer;font-family:inherit;
  box-shadow:0 3px 0 var(--line2);transition:.12s}
.opt .mk{flex:0 0 auto;width:26px;height:26px;border-radius:50%;
  background:var(--brand-s);color:var(--brand-d);font-size:12.5px;font-weight:900;
  display:flex;align-items:center;justify-content:center;line-height:1}
.opt:nth-of-type(even) .mk{background:var(--accent-s);color:var(--accent-d)}
.opt span{flex:1 1 auto;min-width:0}
.opt:hover{border-color:var(--brand);background:#f7fdfc}
.opt:active{transform:translateY(3px);box-shadow:0 0 0 var(--line2)}
/* 逃げ道。無理に選ばせると結果が嘘になるので、点を入れずに進める */
.skip{display:block;width:100%;background:none;border:1px dashed var(--line2);
  color:var(--dim);border-radius:14px;padding:12px;margin:4px 0 2px;
  font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit}
.skip:hover{color:var(--ink);border-color:var(--dim)}
.back{background:none;border:0;color:var(--dim);font-size:13.5px;font-weight:800;
  cursor:pointer;padding:12px 2px;font-family:inherit}
.back:hover{color:var(--ink)}

/* 結果 */
.res{--t:#0e9b93;--ts:#e6f4f2;--td:#0a726c}
.rhead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow-l);margin-bottom:18px}
.rband{height:12px;background:linear-gradient(90deg,var(--t),var(--td))}
.rhead .in{padding:20px 20px 22px;background:var(--ts)}
.rtype{display:inline-block;background:var(--surface);color:var(--td);
  font-size:11.5px;letter-spacing:.14em;font-weight:900;padding:5px 12px;border-radius:99px}
.rname{font-size:33px;font-weight:900;line-height:1.32;margin:12px 0 6px;
  color:var(--td);letter-spacing:-.02em}
.rsub{color:var(--ink);font-size:15px;font-weight:700;margin:0;line-height:1.75}
.okbox{background:var(--surface);border:2px solid var(--ts);border-radius:14px;
  padding:13px 15px;margin:16px 0 0;font-size:14px;line-height:1.75}
.okbox b{display:block;color:var(--td);font-size:11.5px;letter-spacing:.14em;margin-bottom:2px}

/* 8タイプの分布と自分の位置（2026-08-10 追加）
   本人の要望：「どういった型があって、どこら辺に自分が配置されているか」
   ・図はすべてインラインSVG。viewBox固定＋width:100% なので、
     どんな幅でも**絶対に横あふれしない**（360pxで実測済み） */
.figwrap{margin:0 0 4px}
.figbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:13px 11px 11px;margin-bottom:10px}
svg.fig{display:block;width:100%;max-width:100%;height:auto}
.figyou{margin:0 2px 7px;font-size:12.5px;font-weight:900;line-height:1.6;color:var(--ink)}
.figyou b{color:var(--td)}
.fignote{margin:9px 2px 0;font-size:11.5px;color:var(--dim);line-height:1.7}
.fignote b{color:var(--ink);font-weight:800}

.sec{margin:26px 0 0}
.sec h3{font-size:16px;font-weight:900;margin:0 0 12px;color:var(--td);
  display:flex;align-items:center;gap:9px}
.sec h3::before{content:"";flex:0 0 auto;width:10px;height:10px;border-radius:50%;
  background:var(--t)}
.sec p{margin:0 0 12px;font-size:15px}
.advice{background:var(--ts);border-radius:16px;
  padding:15px 16px;margin-bottom:11px;display:flex;gap:12px;align-items:flex-start}
/* 直下の b だけがラベル。本文中の強調（span 内の b）には効かせない */
.advice>b{color:#fff;background:var(--t);font-size:11.5px;font-weight:900;flex:0 0 auto;
  padding:4px 10px;border-radius:99px;margin-top:4px;letter-spacing:.06em;white-space:nowrap}
.advice span{flex:1 1 auto;min-width:0;font-size:14.5px;line-height:1.8}
.advice span b{color:var(--td);font-weight:900}
.today{background:linear-gradient(135deg,var(--t),var(--td));color:#fff;
  border-radius:18px;padding:20px;margin-top:18px;box-shadow:var(--shadow-l)}
.today .t{font-size:11.5px;font-weight:900;letter-spacing:.16em;opacity:.85}
.today .b{font-size:20px;font-weight:900;line-height:1.6;margin-top:8px}
.warnbox{background:var(--warn-s);border:2px solid var(--warn-l);border-radius:16px;
  padding:15px 16px;font-size:14.5px;line-height:1.8}
.warnbox .t{color:var(--warn);font-size:12px;font-weight:900;margin-bottom:4px;
  letter-spacing:.04em}
.note{color:var(--dim);font-size:12.5px;margin-top:26px;line-height:1.85}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{font-size:12px;font-weight:800;color:var(--td);background:var(--ts);
  border-radius:99px;padding:6px 13px}
.chip.plain{color:var(--dim);background:var(--bg2)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:13px 22px;border-radius:99px;font-weight:800;
  font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;
  box-shadow:0 10px 26px rgba(29,36,48,.28);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:420px){
  h1{font-size:25px}
  .rname{font-size:28px}
  .q{font-size:18.5px}
  .opt{font-size:15px;padding:15px 14px}
  .today .b{font-size:18px}
}
</style>

<script>
/* ============================================================

   本人の指示（2026-08-09）：
     「塾や学校で先生に相談したりするじゃん？そんな感じの結果に」
   → 結果は「タイプ名の当てっこ」ではなく、
     ①どこで詰まっているか ②だからこうしなさい ③今日はこれだけ
     が返ってくる形にする。
   ⚠ MBTIの名前は使わない（商標・無資格の診断提供リスク）。
   ============================================================ */

function start(){ idx = 0; history.length = 0;
  Object.keys(score).forEach(k => score[k] = 0); render(); }

const MARK = ["A","B","C","D","E"];

function render(){
  if(idx >= QUESTIONS.length) return result();
  const [scene, q, opts] = QUESTIONS[idx];
  const pct = Math.round(idx / QUESTIONS.length * 100);
  app().innerHTML = `
    <div class="pwrap">
      <div class="pbar"><i style="width:${Math.max(4, pct)}%"></i></div>
      <div class="pnum"><span>あと${QUESTIONS.length - idx}問</span>
        <span><span class="now">${idx+1}</span> / ${QUESTIONS.length}</span></div>
    </div>
    <div class="scene">${scene}</div>
    <div class="q">${q}</div>
    ${opts.map((o,i)=>`<button class="opt" onclick="pick(${i})">
        <span class="mk">${MARK[i]}</span><span>${o[0]}</span></button>`).join('')}
    <button class="skip" onclick="pick(-1)">どれも当てはまらない</button>
    ${idx>0 ? '<button class="back" onclick="back()">← 1つ戻る</button>' : ''}`;
  window.scrollTo(0,0);
}

/* i = -1 は「どれも当てはまらない」＝点を入れずに進む。
   無理に選ばせると結果が嘘になるので、逃げ道を用意している。 */
function pick(i){
  const gain = (i < 0) ? {} : (QUESTIONS[idx][2][i][1] || {});
  Object.keys(gain).forEach(k => { score[k] = (score[k]||0) + gain[k]; });
  history.push(gain);
  idx++; render();
}
function back(){
  if(!history.length) return;
  const gain = history.pop();
  Object.keys(gain).forEach(k => { score[k] -= gain[k]; });
  idx--; render();
}

/* ===== 8タイプの分布と、自分の位置（2026-08-10 追加）=====
   1枚で2つ見せる：
     ① 帯グラフ … どんな型があるか一望＋自分の型だけ大きく縁取り
     ② 点数の内訳 … 8タイプの得点。2位・3位も見えるので「またがっている」かが分かる
   SVGの座標系は幅320固定。width:100% で縮むだけなので横あふれしない。 */
function figure(best, col){
  const X0 = 6, BW = 308, GAP = 1.2;
  const order = Object.keys(RAND_PCT).sort((a,b)=>RAND_PCT[b]-RAND_PCT[a]);
  let x = X0, segs = '', myCx = X0 + BW/2;
  order.forEach(k=>{
    const w = BW * RAND_PCT[k] / 100;
    const c = TYPE_COLOR[k] || TYPE_COLOR.wakatta;
    const mine = (k === best);
    const y = mine ? 8 : 13, h = mine ? 38 : 28;
    segs += `<rect x="${(x+GAP/2).toFixed(2)}" y="${y}" width="${Math.max(1,w-GAP).toFixed(2)}"`
         +  ` height="${h}" rx="${mine?4:2}" fill="${c.c}"`
         +  (mine ? ` stroke="${c.d}" stroke-width="2"` : ` opacity="0.8"`) + `/>`;
    if(w >= 20) segs += `<text x="${(x+w/2).toFixed(2)}" y="${(y+h/2+2.9).toFixed(2)}"`
         + ` text-anchor="middle" font-size="7.5" font-weight="700" fill="#fff">`
         + `${Math.round(RAND_PCT[k])}%</text>`;
    if(mine) myCx = x + w/2;
    x += w;
  });
  // 三角の目印。端でも枠から出ないように内側へ寄せる
  const cx = Math.min(313, Math.max(7, myCx));
  const bar = `<svg class="fig" viewBox="0 0 320 50" role="img"`
    + ` aria-label="8タイプの出やすさの帯グラフ。あなたは${TYPES[best].name}">`
    + `<path d="M${(cx-5).toFixed(2)} 0 L${(cx+5).toFixed(2)} 0 L${cx.toFixed(2)} 5.8 Z"`
    + ` fill="${col.d}"/>${segs}</svg>`;

  // ② 点数の内訳。同点は名前順で固定（描画のたびに順が変わらないように）
  const keys = Object.keys(TYPES);
  const ranked = keys.slice().sort((a,b)=> (score[b]-score[a]) || (a < b ? -1 : 1));
  const maxV = Math.max(1, ...keys.map(k=>score[k]||0));
  const RH = 19, TOP = 13;
  let rows = `<text x="19" y="7.5" font-size="7" font-weight="700" fill="#8b8880">タイプ</text>`
    + `<text x="172" y="7.5" font-size="7" font-weight="700" fill="#8b8880">あなたの点数</text>`
    + `<text x="314" y="7.5" text-anchor="end" font-size="7" font-weight="700" fill="#8b8880">ランダム時の出方</text>`;
  ranked.forEach((k,i)=>{
    const c = TYPE_COLOR[k] || TYPE_COLOR.wakatta;
    const v = score[k] || 0;
    const top = TOP + i * RH, mid = top + 9.5;
    const mine = (k === best), lead = mine || i < 3;
    if(mine) rows += `<rect x="2" y="${top+0.5}" width="316" height="18" rx="5" fill="${c.s}"/>`;
    rows += `<circle cx="11" cy="${mid}" r="3.6" fill="${c.c}" opacity="${lead?1:.45}"/>`
      + `<text x="19" y="${mid+3.4}" font-size="9.5" font-weight="${lead?800:600}"`
      + ` fill="${mine?c.d:'#1d2430'}" opacity="${lead?1:.5}">${TYPES[k].name}</text>`
      + `<rect x="172" y="${mid-4}" width="94" height="8" rx="4" fill="#eae7dd"/>`
      + `<rect x="172" y="${mid-4}" width="${(94*v/maxV).toFixed(2)}" height="8" rx="4"`
      + ` fill="${c.c}" opacity="${lead?1:.45}"/>`
      + `<text x="290" y="${mid+3.2}" text-anchor="end" font-size="9.5" font-weight="800"`
      + ` fill="${mine?c.d:'#1d2430'}" opacity="${lead?1:.5}">${v}点</text>`
      + `<text x="314" y="${mid+3}" text-anchor="end" font-size="7.5" font-weight="700"`
      + ` fill="#9a978f">${RAND_PCT[k].toFixed(1)}%</text>`;
  });
  const H = TOP + keys.length * RH + 2;
  const list = `<svg class="fig" viewBox="0 0 320 ${H}" role="img"`
    + ` aria-label="8タイプそれぞれに入ったあなたの点数">${rows}</svg>`;

  return `<div class="sec figwrap" style="margin-top:0">
      <h3>8つの型の中で、あなたはここ</h3>
      <div class="figbox">
        <p class="figyou">あなた＝<b>${TYPES[best].name}</b></p>
        ${bar}
        <p class="fignote">帯の幅は<b>ランダムに答えた場合の出方</b>（3000回試行の実測）。
          世の中の人の割合ではありません。「どんな型があるか」を見るための目盛りです。</p>
      </div>
      <div class="figbox">
        ${list}
        <p class="fignote">2位・3位にも点が入っていれば、その型が<b>混ざっています</b>。
          点差が小さいときは、両方の助言を試してみてください。</p>
      </div>
    </div>`;
}

  const last = {};

        <div class="sec">
          <h3>効かないのでやらなくていいこと</h3>
          <div class="warnbox"><div class="t">やりがちだけど、あなたには効きません</div>${t.bad}</div>
        </div>

        <div class="chips">
          ${t.tags.map(x=>`<span class="chip">${x}</span>`).join('')}
          <span class="chip plain">次に近いのは「${TYPES[second].name}」</span>
        </div>

        <button class="btn accent" onclick="saveImage()">結果を画像で保存する</button>
        <button class="btn sub" onclick="share()">文字でコピーする</button>
        <button class="btn sub" onclick="title()">もう一度やる</button>
      </div>

      <p class="note">この診断は、あなたを分類するためのものではありません。
        <b>次の一手を1つだけ決めるため</b>のものです。<br>
        合わないと思ったら、いちばん下の「効かないこと」だけ持ち帰ってください。</p>
    </div>`;
  window.scrollTo(0,0);
}

/* ⚠ 2026-08-10 修正：ここは以前、点数だけで並べ直してタイプを決めていた。
   result() は「同点なら後の設問を優先」「1点も入らなければ yusen」という別の決め方を
   しているので、**画面に出ている型と、コピーされる型が食い違うことがあった。**
   result() が決めた結果（RESULT）をそのまま使う。 */
let RESULT = null, RESULT_COL = null;

/* 結果を1枚の画像にして保存する。
   なぜ要るか：診断が広がるのは「結果を人に見せたくなる」からで、
   その主役は文字ではなく画像。ここまで文字のコピーしか無かった。
   外部ライブラリは使わない（canvasだけ）。送信もしない。 */
function saveImage(){
  const t = RESULT, col = RESULT_COL;
  if(!t || !col) return;
  const W = 1080, H = 1080, S = 2;          // 正方形。SNSで切れにくい
  const cv = document.createElement('canvas');
  cv.width = W * S; cv.height = H * S;
  const c = cv.getContext('2d');
  c.scale(S, S);
  const F = (w, px) => `${w} ${px}px "Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif`;

  // 先に文字の高さを測ってから枠を描く。
  // 固定の高さにすると、文が短いタイプで下が間延びする（最初そうなっていた）。
  c.font = F(900, 68);
  const nameH = wrap(c, t.name, 0, 0, W - 216, 84, true);
  c.font = F(700, 30);
  const subH = wrap(c, t.sub, 0, 0, W - 216, 48, true);
  c.font = F(900, 38);
  const todayH = wrap(c, t.today, 0, 0, W - 296, 50, true);

  const nameY = 320;
  const subY = nameY + nameH + 42;
  const boxY = subY + subH + 26;
  const boxH = 74 + todayH + 40;
  const cardBottom = boxY + boxH + 54;
  const top = Math.max(90, (H - 96 - (cardBottom - 116)) / 2);   // 縦に中央寄せ
  const dy = top - 116;

  c.fillStyle = col.s; c.fillRect(0, 0, W, H);
  c.fillStyle = col.c; c.fillRect(0, 0, W, 26);
  c.fillStyle = '#ffffff';
  roundRect(c, 60, top, W - 120, cardBottom - 116, 34); c.fill();

  c.fillStyle = col.d; c.font = F(900, 27);
  c.fillText('勉強のつまずき方診断', 108, 196 + dy);
  c.fillStyle = col.c; c.fillRect(108, 222 + dy, 74, 7);

  c.fillStyle = col.d; c.font = F(900, 68);
  wrap(c, t.name, 108, nameY + dy, W - 216, 84);

  c.fillStyle = '#1d2430'; c.font = F(700, 30);
  wrap(c, t.sub, 108, subY + dy, W - 216, 48);

  c.fillStyle = col.c;
  roundRect(c, 108, boxY + dy, W - 216, boxH, 24); c.fill();
  c.fillStyle = 'rgba(255,255,255,.82)'; c.font = F(900, 23);
  c.fillText('今日やる1つだけ', 148, boxY + dy + 54);
  c.fillStyle = '#ffffff'; c.font = F(900, 38);
  wrap(c, t.today, 148, boxY + dy + 114, W - 296, 50);

  c.fillStyle = '#6d6a63'; c.font = F(700, 26);
  c.fillText('d-studylab.com — 15問・2分', 108, H - 62);

  cv.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `勉強のつまずき方診断_${t.name}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    const el = $('toast'); el.textContent = '画像を保存しました';
    el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1800);
  }, 'image/png');
}

function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);         c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* 日本語は単語で切れないので、1文字ずつ幅を測って折る。
   measure=true のときは描かずに、必要な高さだけを返す（先に枠の大きさを決めるため）。 */
function wrap(c, text, x, y, maxW, lh, measure){
  let line = '', n = 0;
  const put = () => { if(!measure) c.fillText(line, x, y + n * lh); n++; };
  for(const ch of String(text)){
    if(c.measureText(line + ch).width > maxW && line){ put(); line = ch; }
    else { line += ch; }
  }
  if(line) put();
  return measure ? n * lh : y + n * lh;
}

function share(){
  const t = RESULT || TYPES[Object.keys(score).sort((a,b)=>score[b]-score[a])[0]];
  const txt = `勉強のつまずき方診断\n私は「${t.name}」でした。\n\n今日やる1つ：${t.today}\n\n`;
  const done = ()=>{ const el=$('toast'); el.classList.add('on');
    setTimeout(()=>el.classList.remove('on'),1600); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, done);
  } else {
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); done();
  }
}

title();
</script>
